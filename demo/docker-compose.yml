# Demo stack: React frontend + FastAPI backend + JupyterLab SDK
# playground.
#
# By default (`docker compose up`), each service pulls a pre-built
# multi-arch image from GHCR. ~60 s on a warm network.
#
# To build from source instead (e.g. to verify the published images
# match this repo's source - the OSS-track reviewer path), pass
# `--build`:
#
#   docker compose up --build
#
# That ignores `image:` and uses the `build:` block. ~5 min on
# first run because the backend pre-downloads model weights.

services:
  backend:
    image: ghcr.io/prabal-rje/latentscore-demo-backend:latest
    build:
      context: ..
      dockerfile: demo/backend/Dockerfile
    ports:
      - "4244:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/prabal-rje/latentscore-demo-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_ANONYMOUS: "${VITE_ANONYMOUS:-false}"
    ports:
      - "4242:80"
    depends_on:
      backend:
        condition: service_healthy

  notebook:
    # Token-less JupyterLab with latentscore pre-installed. Same
    # quickstart.ipynb as the Colab notebook. Bound to 127.0.0.1
    # only because token auth is disabled - do NOT expose this
    # port to the public internet.
    image: ghcr.io/prabal-rje/latentscore-demo-notebook:latest
    build:
      context: ..
      dockerfile: demo/notebook/Dockerfile
    ports:
      - "127.0.0.1:8889:8888"
