services:
  backend:
    build:
      # Build from the latentscore repo root so the Dockerfile can install
      # the bundled latentscore source via `pip install ./latentscore-src`.
      context: ..
      dockerfile: demo/backend/Dockerfile
    ports:
      - "4244:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ANONYMOUS: "${VITE_ANONYMOUS:-false}"
    ports:
      - "4242:80"
    depends_on:
      backend:
        condition: service_healthy

  notebook:
    # Token-less Jupyter Lab with latentscore pre-installed. Same
    # quickstart.ipynb as the Colab notebook, but runs locally so
    # nobody has to set up Python on the host. Token auth is disabled
    # since this is intended for localhost use only -- do NOT expose
    # this port to the public internet.
    build:
      context: ..
      dockerfile: demo/notebook/Dockerfile
    ports:
      # Bind to loopback only - the notebook runs token-less, so we
      # must not let it accept connections from outside this machine.
      - "127.0.0.1:8889:8888"
