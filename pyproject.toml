[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentscore"
version = "0.1.4"
description = "Generate ambient music from text. Locally. No GPU required."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Synthesis + audio I/O + playback + CLI rendering.
    "numpy",
    "scipy",
    "soundfile",
    "sounddevice",
    "pydantic>=2",
    "rich",
    # Default text-prompt retrieval (the "fast" model). Embedding-match quality
    # out of the box — no extra needed for the headline `ls.render("text")` API.
    "sentence-transformers",
    "torch",
    "huggingface_hub>=0.20",
    "transformers>=4.57.0,<5",
    "tokenizers>=0.20.0",
    "sentencepiece",
]

[project.optional-dependencies]
# Back-compat alias: pre-0.1.4 users had to do `pip install "latentscore[fast]"`.
# Everything that was in [fast] is now in core, so this is intentionally empty.
fast = []
# Bring-your-own hosted LLM via LiteLLM (Anthropic / Gemini / OpenAI / ...).
external = [
    "litellm>=1.0",
    "python-dotenv",
    "json-repair",
]
# CLAP-audio retrieval (experimental, heavy — torchvision + laion-clap).
heavy = [
    "laion-clap",
    "torchvision",
]
# Local LLM inference (expressive mode) - CPU-only, uses huggingface transformers.
expressive = [
    "outlines",
    "instructor",
    "bitsandbytes; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "llama-cpp-python; platform_machine != 'arm64' and sys_platform != 'win32'",
]

[project.scripts]
latentscore = "latentscore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["latentscore", "latentscore.*", "common", "common.*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto --maxfail=1 --cov=latentscore --cov=data_work --cov-report=term-missing"
testpaths = ["tests"]
