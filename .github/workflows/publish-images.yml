# Produces demo images:
#   - ghcr.io/prabal-rje/latentscore-demo-backend
#   - ghcr.io/prabal-rje/latentscore-demo-frontend
#   - ghcr.io/prabal-rje/latentscore-demo-notebook
#
# Reviewers should use:
#   docker compose -f demo/docker-compose.yml up --build
#
# Prebuilt images are published for convenience and are tagged by release.
#
# Fires on:
#   - tag push matching v*  (e.g. `git tag v0.1.7 && git push --tags`)
#   - manual dispatch        (Actions tab -> "Run workflow" -- useful for
#                             dry-run testing without cutting a real release)

name: Publish demo images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: demo/backend/Dockerfile
            context: .
          - service: frontend
            dockerfile: demo/frontend/Dockerfile
            context: demo/frontend
          - service: notebook
            dockerfile: demo/notebook/Dockerfile
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The notebook image installs latentscore[external,heavy], which pulls
      # in torch + a pile of NVIDIA CUDA wheels (even on CPU-only builds).
      # Multi-arch buildx (amd64 + arm64 in parallel under QEMU) doubles
      # the peak disk pressure. The runner's ~14 GB usable disk is too
      # small. This step reclaims ~30 GB by purging GitHub-pre-installed
      # toolchains we don't use (Android, .NET, Haskell, etc.).
      - name: Free disk space (notebook only)
        if: matrix.service == 'notebook'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/latentscore-demo-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=latentscore-demo-${{ matrix.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
