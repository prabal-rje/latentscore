name: Publish Rust Crate to crates.io

on:
  push:
    tags:
      - "rs-v*"
  # Manual dispatch runs test, clippy, and package verification only (never publishes without an rs-v* tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers for playback verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/rs-v')
        working-directory: crates/latentscore
        run: |
          TAG_VER="${GITHUB_REF_NAME#rs-v}"
          CRATE_VER="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$TAG_VER" = "$CRATE_VER" || (echo "Tag $TAG_VER != Cargo.toml $CRATE_VER" && exit 1)

      - name: Test, clippy, and package before publish
        working-directory: crates/latentscore
        run: |
          cargo test
          cargo test --features playback
          cargo clippy --all-targets -- -D warnings
          cargo clippy --features playback --all-targets -- -D warnings
          cargo package --allow-dirty

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/rs-v')
        working-directory: crates/latentscore
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
