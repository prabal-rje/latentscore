name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libportaudio2

      - name: Install core and test dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3"
          pip install -e .
          pip install build pytest pytest-asyncio hypothesis ruff pyright

      - name: Lint and type-check
        run: |
          ruff check latentscore/synth.py latentscore/main.py latentscore/score.py latentscore/__init__.py tests/test_latentscore_synth.py tests/test_score_and_spec_parity.py
          pyright latentscore/score.py latentscore/synth.py latentscore/__init__.py

      - name: Verify generated browser synth asset is up to date
        run: |
          python demo/scripts/build_browser_assets.py
          git diff --exit-code demo/frontend/public/py/latentscore_synth.py

      - name: Run Python unit, doctest, and spec parity tests
        run: |
          pytest -o addopts="" --doctest-modules latentscore/score.py \
            tests/test_latentscore_synth.py \
            tests/test_latentscore_config.py \
            tests/test_latentscore_audio.py \
            tests/test_latentscore_dx.py \
            tests/test_latentscore_streaming.py \
            tests/test_score_and_spec_parity.py \
            tests/test_latentscore_synth_config.py
          pytest -o addopts="" tests/test_dependency_boundaries.py -k "module_top"

      - name: Build wheel and smoke-test packaged data outside repo
        run: |
          python -m build --wheel --outdir /tmp/ls-dist
          python -c "import glob, zipfile; whl = glob.glob('/tmp/ls-dist/*.whl')[0]; z = zipfile.ZipFile(whl); assert 'latentscore/_mood_lexicon.json' in z.namelist(), 'Missing _mood_lexicon.json in wheel'"
          python -m venv /tmp/ls-wheel-venv
          /tmp/ls-wheel-venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3"
          /tmp/ls-wheel-venv/bin/pip install /tmp/ls-dist/*.whl
          cd /tmp && /tmp/ls-wheel-venv/bin/python -c "import latentscore as ls; buf = ls.Score('quiet morning desk').fill(256); assert len(buf) == 256"

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install, build, and test (ESM, CJS, spec parity, npm pack, Node16 tsc)
        working-directory: packages/latentscore
        run: |
          npm ci
          npm test

  rust:
    name: Rust Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers for cpal playback feature
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install Rust toolchain with clippy and wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Test default and playback features + clippy + wasm + cargo package
        working-directory: crates/latentscore
        run: |
          cargo test
          cargo test --features playback
          cargo clippy --all-targets -- -D warnings
          cargo clippy --features playback --all-targets -- -D warnings
          cargo check --target wasm32-unknown-unknown
          cargo package --allow-dirty

  demo-frontend:
    name: Demo Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Build and lint demo frontend
        working-directory: demo/frontend
        run: |
          npm ci
          npm run lint
          npm run build
